# 경로 기반 라벨 (actions/labeler v5). 검증 장치를 건드리는 PR을 결정론적으로 표시한다.
# 규칙: docs/process/verification-change.md

verification-change:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/workflows/**"
          - ".github/labeler.yml"
          - ".github/PULL_REQUEST_TEMPLATE.md"
          - "scripts/**"
          - "tools/**"
          - "**/src/test/**"
          - "**/src/androidTest/**"
          - "AGENTS.md"
          - "CLAUDE.md"
          - "docs/process/**"
          - "docs/context/**"

build-config:
  - changed-files:
      - any-glob-to-any-file:
          - "gradle/libs.versions.toml"
          - "gradle.properties"
          - "settings.gradle.kts"
          - "build.gradle.kts"
          - "common.gradle"
          - "**/build.gradle.kts"
          - "**/proguard-rules.pro"
          - "scripts/module-deps-baseline.txt"

module-boundary:
  - changed-files:
      - any-glob-to-any-file:
          - "settings.gradle.kts"
          - "**/build.gradle.kts"
          - "common.gradle"
          - "scripts/module-deps-baseline.txt"
