name: Play Release (Internal Testing)

# release/** 브랜치를 푸시하면 release AAB 를 내부 테스트 트랙에 바로 배포한다.
# 테스터가 플레이스토어에서 확인한 뒤 "Play Promote to Production" 워크플로로 같은 빌드(같은 versionCode)를
# 프로덕션 초안으로 옮기고, 심사 제출은 콘솔에서 한다.

on:
  push:
    branches:
      - 'release/**'

permissions:
  contents: read

env:
  JAVA_VERSION: '17'

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read release version
        id: version
        run: |
          VERSION_NAME=$(grep -E '^version_name=' gradle.properties | cut -d'=' -f2)
          VERSION_CODE=$(grep -E '^version_code=' gradle.properties | cut -d'=' -f2)

          if [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ]; then
            echo "version_name/version_code missing from gradle.properties" >&2
            exit 1
          fi

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag_name=v${VERSION_NAME}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode Keystore
        run: |
          printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/3dollor-android-key.jks

      - name: Create local.properties
        run: |
          cat > local.properties <<EOF
          sdk.dir=${ANDROID_HOME}
          google_map_key=${{ secrets.GOOGLE_MAP_KEY }}
          nmf_client_id=${{ secrets.NMF_CLIENT_ID }}
          admob_id=${{ secrets.ADMOB_ID }}
          kakao_key_dev=${{ secrets.KAKAO_KEY_DEV }}
          kakao_map_key=${{ secrets.KAKAO_MAP_KEY }}
          develop_url=${{ secrets.DEVELOP_URL }}
          deep_link=${{ secrets.DEEP_LINK }}
          application_id_dev=${{ secrets.APPLICATION_ID_DEV }}
          kakao_key_release=${{ secrets.KAKAO_KEY_RELEASE }}
          kakao_map_key_release=${{ secrets.KAKAO_MAP_KEY_RELEASE }}
          release_url=${{ secrets.RELEASE_URL }}
          deep_link_release=${{ secrets.DEEP_LINK_RELEASE }}
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release AAB
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Verify AAB
        id: artifacts
        run: |
          RELEASE_AAB="app/build/outputs/bundle/release/app-release.aab"
          test -f "$RELEASE_AAB"
          echo "release_aab=$RELEASE_AAB" >> "$GITHUB_OUTPUT"

      - name: Prepare release notes
        run: |
          # verification-assets 처럼 v 로 시작하는 비버전 태그가 섞이지 않도록 vX.Y.Z / v.X.Y.Z 만 고른다.
          # 두 표기가 섞여 있어 refname 정렬로는 최신을 못 찾으므로 접두사를 떼어낸 값으로 정렬한다.
          PREVIOUS_TAG=$(git tag --list \
            | grep -E '^v\.?[0-9]+\.[0-9]+\.[0-9]+$' \
            | awk '{key=$0; sub(/^v\.?/,"",key); print key"\t"$0}' \
            | sort -V -r \
            | head -n 1 \
            | cut -f2 || true)
          echo "previous tag: ${PREVIOUS_TAG:-(none)}"
          mkdir -p distribution/whatsnew

          COMMITS=""
          if [ -n "$PREVIOUS_TAG" ]; then
            COMMITS=$(git log --no-merges --pretty=format:"- %s" "${PREVIOUS_TAG}..HEAD" || true)
          fi

          if [ -z "$COMMITS" ]; then
            COMMITS="- ${{ steps.version.outputs.tag_name }} 릴리즈"
          fi

          # Play 의 what's new 는 언어당 500자 제한이고, 파일 끝 개행까지 길이에 포함된다.
          # 바이트가 아니라 유니코드 문자 수 기준이라 한글이 섞여도 python 으로 세야 정확하다.
          python3 - "$COMMITS" > distribution/whatsnew/whatsnew-ko-KR <<'PY'
          import sys

          LIMIT = 500
          ELLIPSIS = "..."
          # 출력 마지막 개행 1자도 Play 가 세므로 본문은 LIMIT - 1 까지만 허용한다.
          MAX_TEXT = LIMIT - 1
          text = sys.argv[1].strip()

          if len(text) > MAX_TEXT:
              budget = MAX_TEXT - len(ELLIPSIS) - 1
              kept, total = [], 0
              for line in text.split("\n"):
                  if total + len(line) > budget:
                      break
                  kept.append(line)
                  total += len(line) + 1
              text = "\n".join(kept + [ELLIPSIS]) if kept else text[:MAX_TEXT - len(ELLIPSIS)] + ELLIPSIS

          assert len(text) + 1 <= LIMIT, "release notes still exceed %d chars" % LIMIT
          sys.stdout.write(text + "\n")
          PY

          NOTES_LEN=$(python3 -c "import sys; print(len(open(sys.argv[1], encoding='utf-8').read()))" distribution/whatsnew/whatsnew-ko-KR)
          echo "release notes (${NOTES_LEN} chars, Play limit 500):"
          cat distribution/whatsnew/whatsnew-ko-KR

      # Play 는 앱 상태에 따라 changesNotSentForReview 를 요구하거나(심사 거절 등으로 자동 심사 제출이 막힌 상태)
      # 거부한다("Changes are sent for review automatically"). 옵션 없이 먼저 올리고, 실패하면 옵션을 켜서 한 번 더 올린다.
      # Edit 커밋이 실패하면 업로드한 AAB 도 반영되지 않으므로 재시도해도 중복 업로드가 되지 않는다.
      - name: Upload to Google Play internal testing
        id: upload
        continue-on-error: true
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.zion830.threedollars
          releaseFiles: ${{ steps.artifacts.outputs.release_aab }}
          tracks: internal
          status: completed
          releaseName: ${{ steps.version.outputs.tag_name }}
          whatsNewDirectory: distribution/whatsnew

      - name: Upload to Google Play internal testing (changes not sent for review)
        if: steps.upload.outcome == 'failure'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.zion830.threedollars
          releaseFiles: ${{ steps.artifacts.outputs.release_aab }}
          tracks: internal
          status: completed
          releaseName: ${{ steps.version.outputs.tag_name }}
          whatsNewDirectory: distribution/whatsnew
          changesNotSentForReview: true

      - name: Notify Slack on Success
        if: success()
        continue-on-error: true
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "blocks": [
                {
                  "type": "header",
                  "text": {"type": "plain_text", "text": "Play Store 내부 테스트 배포 완료"}
                },
                {
                  "type": "section",
                  "fields": [
                    {"type": "mrkdwn", "text": "*Version:*\n${{ steps.version.outputs.tag_name }}"},
                    {"type": "mrkdwn", "text": "*Version Code:*\n${{ steps.version.outputs.version_code }}"}
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Internal Test:* <https://play.google.com/apps/internaltest/4699298931467208901|테스터 참여 링크>\n확인이 끝나면 <${{ github.server_url }}/${{ github.repository }}/actions/workflows/play-promote-production.yml|Play Promote to Production> 으로 같은 빌드를 프로덕션 초안에 올린다."
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Notify Discord on Success
        if: success()
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          PROMOTE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/play-promote-production.yml
        run: |
          PAYLOAD=$(jq -n \
            --arg tag_name "$TAG_NAME" \
            --arg version_code "$VERSION_CODE" \
            --arg promote_url "$PROMOTE_URL" \
            '{
              username: "가슴속삼천원 배포 알림",
              allowed_mentions: {parse: []},
              embeds: [{
                title: "Play Store 내부 테스트 배포 완료",
                color: 3066993,
                description: ("[내부 테스트 참여](https://play.google.com/apps/internaltest/4699298931467208901)\n확인이 끝나면 [Play Promote to Production](" + $promote_url + ") 으로 같은 빌드를 프로덕션 초안에 올린다."),
                fields: [
                  {name: "Version", value: $tag_name, inline: true},
                  {name: "Version Code", value: $version_code, inline: true}
                ]
              }]
            }')

          curl --fail-with-body --silent --show-error --retry 2 \
            --header "Content-Type: application/json" \
            --data "$PAYLOAD" \
            "${DISCORD_WEBHOOK_URL}?wait=true" > /dev/null

      - name: Notify Slack on Failure
        if: failure()
        continue-on-error: true
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "blocks": [
                {
                  "type": "header",
                  "text": {"type": "plain_text", "text": "Play Store 내부 테스트 배포 실패"}
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Workflow:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Notify Discord on Failure
        if: failure()
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          PAYLOAD=$(jq -n \
            --arg workflow_url "$WORKFLOW_URL" \
            '{
              username: "가슴속삼천원 배포 알림",
              allowed_mentions: {parse: []},
              embeds: [{
                title: "Play Store 내부 테스트 배포 실패",
                color: 15158332,
                description: ("[워크플로 실행 결과 확인](" + $workflow_url + ")")
              }]
            }')

          curl --fail-with-body --silent --show-error --retry 2 \
            --header "Content-Type: application/json" \
            --data "$PAYLOAD" \
            "${DISCORD_WEBHOOK_URL}?wait=true" > /dev/null
