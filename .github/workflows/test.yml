name: Test

# 모든 PR에서 실행 (스택 PR처럼 base가 feature 브랜치여도)
# 결과 요약·TC 커버리지 표는 scripts/test-summary.sh 가 만든다. 기준: docs/process/testing.md
on:
  pull_request:

# 같은 PR에 새 푸시가 오면 이전 실행은 취소
concurrency:
  group: test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write   # 결과 코멘트

jobs:
  unit-test:
    name: 유닛 테스트 (testDebugUnitTest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # 디버그 signingConfig 가 keystore 파일을 참조한다. 유닛 테스트는 패키징하지 않지만
      # 설정 평가 단계에서 파일이 없으면 경고가 나므로 배포 워크플로와 동일하게 복원한다.
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/3dollor-android-key.jks

      # app/core:network 의 build.gradle.kts 가 local.properties 를 무조건 읽는다.
      # 값이 비어도 유닛 테스트에는 영향이 없다 (BuildConfig 문자열로만 들어감).
      - name: Create local.properties
        run: |
          cat << EOF > local.properties
          sdk.dir=${ANDROID_HOME}
          google_map_key=${{ secrets.GOOGLE_MAP_KEY }}
          nmf_client_id=${{ secrets.NMF_CLIENT_ID }}
          admob_id=${{ secrets.ADMOB_ID }}
          kakao_key_dev=${{ secrets.KAKAO_KEY_DEV }}
          kakao_map_key=${{ secrets.KAKAO_MAP_KEY }}
          develop_url=${{ secrets.DEVELOP_URL }}
          deep_link=${{ secrets.DEEP_LINK }}
          application_id_dev=${{ secrets.APPLICATION_ID_DEV }}
          EOF

      - name: gradlew 실행 권한
        run: chmod +x gradlew

      - name: testDebugUnitTest
        id: test
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace
        continue-on-error: true

      - name: 결과 요약 (Job Summary)
        if: always()
        run: |
          mkdir -p build
          scripts/test-summary.sh > build/summary.md
          cat build/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: 결과 코멘트 (PR, 갱신형)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          MARK="<!-- test-evidence -->"
          { echo "$MARK"; cat build/summary.md; echo; echo "_[워크플로 실행](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})_"; } > build/comment.md
          ID="$(gh api "repos/$REPO/issues/$PR/comments" --paginate --jq ".[] | select(.body | startswith(\"$MARK\")) | .id" | head -1)"
          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$ID" -F body=@build/comment.md > /dev/null
          else
            gh pr comment "$PR" --repo "$REPO" --body-file build/comment.md
          fi

      - name: 테스트 리포트 아티팩트
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/build/test-results/**/*.xml'
          retention-days: 14
          if-no-files-found: ignore

      - name: 실패 판정
        if: always()
        run: |
          if [ "${{ steps.test.outcome }}" != "success" ]; then
            echo "::error::유닛 테스트가 실패했거나 실행되지 못했습니다. 위 'testDebugUnitTest' 스텝 로그와 결과 코멘트를 확인하세요."
            exit 1
          fi
