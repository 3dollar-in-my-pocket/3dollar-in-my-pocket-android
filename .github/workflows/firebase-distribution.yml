name: Firebase App Distribution

on:
  pull_request:
    branches:
      - 'release/**'
    types:
      - closed
  workflow_dispatch:
    inputs:
      release_notes:
        description: '배포 노트 (비우면 해당 브랜치 최근 커밋 20개를 사용)'
        required: false
        type: string

env:
  JAVA_VERSION: '17'

jobs:
  build-and-distribute:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/3dollor-android-key.jks

      - name: Create local.properties
        run: |
          cat << EOF > local.properties
          sdk.dir=${ANDROID_HOME}
          google_map_key=${{ secrets.GOOGLE_MAP_KEY }}
          nmf_client_id=${{ secrets.NMF_CLIENT_ID }}
          admob_id=${{ secrets.ADMOB_ID }}
          kakao_key_dev=${{ secrets.KAKAO_KEY_DEV }}
          kakao_map_key=${{ secrets.KAKAO_MAP_KEY }}
          develop_url=${{ secrets.DEVELOP_URL }}
          deep_link=${{ secrets.DEEP_LINK }}
          application_id_dev=${{ secrets.APPLICATION_ID_DEV }}
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Find APK path
        id: apk
        run: |
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" -type f | head -1)
          echo "path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Build release notes
        id: release_notes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          MANUAL_NOTES: ${{ github.event.inputs.release_notes }}
        run: |
          VERSION=$(grep "version_name=" gradle.properties | cut -d'=' -f2)
          VERSION_CODE=$(grep -E '^version_code=' gradle.properties | cut -d'=' -f2)

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            HEADLINE="수동 배포: ${GITHUB_REF_NAME}"
            SOURCE="$GITHUB_REF_NAME"
            LINK="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            if [ -n "$MANUAL_NOTES" ]; then
              BODY="$MANUAL_NOTES"
            else
              BODY=$(git log --pretty=format:"- %s" -20)
            fi
          else
            HEADLINE="PR #${PR_NUMBER}: ${PR_TITLE}"
            SOURCE="$BASE_REF"
            LINK="$PR_URL"
            BODY=$(git log --pretty=format:"- %s" "${BASE_SHA}..${HEAD_SHA}" | head -20)
          fi

          RELEASE_NOTES="${HEADLINE}
          Version: ${VERSION}

          Changes:
          ${BODY}"

          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$RELEASE_NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "headline=$HEADLINE" >> $GITHUB_OUTPUT
          echo "source=$SOURCE" >> $GITHUB_OUTPUT
          echo "link=$LINK" >> $GITHUB_OUTPUT

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: android-소지자
          file: ${{ steps.apk.outputs.path }}
          releaseNotes: ${{ steps.release_notes.outputs.notes }}

      - name: Notify Slack on Success
        if: success()
        continue-on-error: true
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "Firebase App Distribution 배포 완료"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {"type": "mrkdwn", "text": "*Version:*\n${{ steps.release_notes.outputs.version }}"},
                    {"type": "mrkdwn", "text": "*Branch:*\n${{ steps.release_notes.outputs.source }}"}
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Source:* <${{ steps.release_notes.outputs.link }}|${{ steps.release_notes.outputs.headline }}>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Notify Discord on Success
        if: success()
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          VERSION: ${{ steps.release_notes.outputs.version }}
          BUILD: ${{ steps.release_notes.outputs.version_code }}
          BRANCH: ${{ steps.release_notes.outputs.source }}
          WORKFLOW: ${{ github.workflow }}
          SOURCE_URL: ${{ steps.release_notes.outputs.link }}
        run: |
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          COMMIT_MSG="$(git log -1 --pretty=%B)"

          PAYLOAD="$(VERSION="$VERSION" BUILD="$BUILD" BRANCH="$BRANCH" \
            WORKFLOW="$WORKFLOW" SHORT_SHA="$SHORT_SHA" COMMIT_MSG="$COMMIT_MSG" \
            SOURCE_URL="$SOURCE_URL" \
            python3 - <<'PY'
          import os, json

          version  = os.environ.get("VERSION") or "-"
          build    = os.environ.get("BUILD") or "-"
          branch   = os.environ.get("BRANCH") or "-"
          workflow = os.environ.get("WORKFLOW") or "-"
          sha      = os.environ.get("SHORT_SHA") or "-"
          url      = os.environ.get("SOURCE_URL") or ""
          # Discord embed description은 4096자 제한이라 넉넉히 자른다
          msg      = (os.environ.get("COMMIT_MSG") or "").strip()[:1500] or "-"

          embed = {
              "title": "🤖 [AOS] Firebase App Distribution 업로드",
              "color": 5814783,
              "fields": [
                  {"name": "버전",       "value": f"{version} ({build})", "inline": True},
                  {"name": "브랜치",     "value": branch,                 "inline": True},
                  {"name": "워크플로우", "value": workflow,               "inline": True},
              ],
              "description": f"**커밋** `{sha}`\n```\n{msg}\n```",
          }
          if url:
              embed["url"] = url

          print(json.dumps({
              "username": "GitHub Actions",
              "allowed_mentions": {"parse": []},
              "embeds": [embed],
          }))
          PY
          )"

          curl --fail-with-body --silent --show-error --retry 2 \
            --header "Content-Type: application/json" \
            --data "$PAYLOAD" \
            "${DISCORD_WEBHOOK_URL}?wait=true" > /dev/null

      - name: Notify Slack on Failure
        if: failure()
        continue-on-error: true
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "blocks": [
                {
                  "type": "header",
                  "text": {"type": "plain_text", "text": "Firebase App Distribution 배포 실패"}
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Workflow:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Notify Discord on Failure
        if: failure()
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          PAYLOAD=$(jq -n \
            --arg workflow_url "$WORKFLOW_URL" \
            '{
              username: "GitHub Actions",
              allowed_mentions: {parse: []},
              embeds: [{
                title: "❌ [AOS] Firebase App Distribution 실패",
                color: 15158332,
                url: $workflow_url,
                description: ("[워크플로 실행 결과 확인](" + $workflow_url + ")")
              }]
            }')

          curl --fail-with-body --silent --show-error --retry 2 \
            --header "Content-Type: application/json" \
            --data "$PAYLOAD" \
            "${DISCORD_WEBHOOK_URL}?wait=true" > /dev/null
